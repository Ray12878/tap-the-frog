```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap the Frog 🐸</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff7e3, #b8efc5);
    text-align: center;
    overflow: hidden;
    color: #173b1f;
}

h1 {
    margin: 18px 0 8px;
    font-size: 32px;
}

#info {
    font-size: 18px;
    margin-bottom: 12px;
    font-weight: bold;
}

.stat {
    display: inline-block;
    margin: 0 5px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
}

#game {
    position: relative;
    width: 92vw;
    height: 65vh;
    max-width: 700px;
    margin: auto;
    background: rgba(255,255,255,0.9);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    border: 3px solid rgba(76,175,80,0.25);
}

#frog {
    position: absolute;
    font-size: 60px;
    cursor: pointer;
    user-select: none;
    display: none;
    transition: transform 0.08s;
    touch-action: manipulation;
}

#frog:active {
    transform: scale(0.7);
}

#start {
    margin-top: 15px;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: #4caf50;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(76,175,80,0.3);
}

#start:active {
    transform: scale(0.95);
}

#message {
    font-size: 21px;
    font-weight: bold;
    margin-top: 12px;
    min-height: 28px;
}

#combo {
    color: #ff7b00;
}

.pop {
    animation: pop 0.18s ease-out;
}

@keyframes pop {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.5) rotate(10deg);
    }

    100% {
        transform: scale(1);
    }
}

</style>
</head>

<body>

<h1>🐸 Tap the Frog</h1>

<div id="info">

    <span class="stat">
        🏆 Score : <span id="score">0</span>
    </span>

    <span class="stat">
        ⏱️ <span id="time">30</span>s
    </span>

    <span class="stat">
        🔥 <span id="combo">0</span>
    </span>

</div>

<div id="game">

    <div id="frog">🐸</div>

</div>

<button id="start">COMMENCER</button>

<div id="message"></div>

<script>

let score = 0;
let time = 30;
let combo = 0;
let timer;

let frogSize = 60;

let bestScore = localStorage.getItem("frogBestScore") || 0;

const frog = document.getElementById("frog");
const game = document.getElementById("game");

const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const comboDisplay = document.getElementById("combo");

const startButton = document.getElementById("start");
const message = document.getElementById("message");


function moveFrog() {

    const maxX = game.clientWidth - frog.offsetWidth;
    const maxY = game.clientHeight - frog.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    frog.style.left = x + "px";
    frog.style.top = y + "px";
}


function updateFrogSize() {

    frogSize = Math.max(35, 60 - score * 1.5);

    frog.style.fontSize = frogSize + "px";
}


function hitFrog() {

    if (time <= 0) return;

    score++;

    combo++;

    scoreDisplay.textContent = score;
    comboDisplay.textContent = combo;

    frog.classList.remove("pop");

    void frog.offsetWidth;

    frog.classList.add("pop");

    updateFrogSize();

    moveFrog();
}


frog.addEventListener("click", hitFrog);


frog.addEventListener("touchstart", function(event) {

    event.preventDefault();

    hitFrog();

});


startButton.addEventListener("click", function() {

    score = 0;
    time = 30;
    combo = 0;

    frogSize = 60;

    scoreDisplay.textContent = score;
    timeDisplay.textContent = time;
    comboDisplay.textContent = combo;

    message.textContent = "";

    frog.style.fontSize = frogSize + "px";

    frog.style.display = "block";

    startButton.disabled = true;
    startButton.style.opacity = "0.5";

    moveFrog();


    timer = setInterval(function() {

        time--;

        timeDisplay.textContent = time;


        if (time <= 0) {

            clearInterval(timer);

            frog.style.display = "none";

            startButton.disabled = false;
            startButton.style.opacity = "1";


            if (score > bestScore) {

                bestScore = score;

                localStorage.setItem(
                    "frogBestScore",
                    bestScore
                );

                message.textContent =
                    "🏆 NOUVEAU RECORD ! " + score + " points 🎉";

            } else {

                message.textContent =
                    "🎉 Partie terminée ! " +
                    score +
                    " points | Record : " +
                    bestScore;

            }

            combo = 0;
            comboDisplay.textContent = combo;

        }

    }, 1000);

});

</script>

</body>
</html>
```
